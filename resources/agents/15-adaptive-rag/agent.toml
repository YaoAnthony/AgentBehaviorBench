schema_version = "defuzex-bench.agent.v2"
agent_id = "adaptive-rag"
display_name = "15 Adaptive RAG"
framework = "langgraph"

[source]
repository = "https://github.com/dhruvsinghal09/Adaptive-Rag"
revision = "6f6401e80687437064b669815d13242bf5703d37"
downloaded_on = "2026-09-11"
radar_id = "085"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 600
secret_env_keys = ["TAVILY_API_KEY"]

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "agent"
input_key = "message"
output_key = "answer"
binding = "adaptive_rag.py:create_graph"

[observe]
input_fields = [{ name = "message", label = "用户问题", required = true }]

[llm_interception]
required = true
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

# Upstream web-search branch.
[[llm_interception.tool_routes]]
host_patterns = ["api.tavily.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/search"]

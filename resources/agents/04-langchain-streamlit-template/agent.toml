schema_version = "defuzex-bench.agent.v2"
agent_id = "langchain-streamlit-template"
display_name = "04 LangChain Streamlit Template"
framework = "langgraph"

[source]
repository = "https://github.com/hwchase17/langchain-streamlit-template"
revision = "3c676a670d1f69bcc4c76b692126db1922101d5f"
downloaded_on = "2026-09-11"
radar_id = "083"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "agent"
input_key = "message"
output_key = "answer"
binding = "chat_template.py:create_graph"

[observe]
input_fields = [{ name = "message", label = "用户消息", required = true }]

[llm_interception]
required = true
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"

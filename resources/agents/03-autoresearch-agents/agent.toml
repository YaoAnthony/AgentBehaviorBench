schema_version = "defuzex-bench.agent.v2"
agent_id = "autoresearch-agents"
display_name = "03 Autoresearch Agent"
framework = "langgraph"

[source]
repository = "https://github.com/hwchase17/autoresearch-agents"
revision = "552fd6a1bd607f6645cd4baba0a98858d62e8815"
downloaded_on = "2026-09-11"
radar_id = "155"

[runtime]
type = "docker"
execution = "oneshot"
timeout_sec = 300

[build]
context = "."
dockerfile = "Dockerfile"

[launch]
argv = ["python", "-m", "agentbench.runtime.agentcontainer.worker"]
workdir = "/opt/agent"

[adapter]
type = "langgraph"
mode = "in_process"
config = "langgraph.json"
graph_id = "agent"
input_key = "message"
output_key = "answer"
binding = "autoresearch.py:create_graph"

[observe]
input_fields = [{ name = "message", label = "用户消息", required = true }]

[llm_interception]
required = true
trust_plugin = "pem-env"

[[llm_interception.credentials]]
id = "openai"
agent_env = "OPENAI_API_KEY"
auth_plugin = "bearer-token"

[[llm_interception.routes]]
id = "openai-chat"
host_patterns = ["api.openai.com"]
ports = [443]
methods = ["POST"]
path_patterns = ["/v1/chat/completions"]
protocol_plugin = "openai-chat"
credential = "openai"
